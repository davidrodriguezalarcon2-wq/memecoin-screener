name: Memecoin Screener

on:
  schedule:
    # Cada 5 minutos = el MÍNIMO que permite GitHub. Aun así es "best-effort":
    # bajo carga, GitHub puede retrasarlo o saltarse alguna ejecución (5-15 min reales).
    - cron: '*/5 * * * *'
  workflow_dispatch:  # permite lanzarlo a mano desde la pestaña Actions (botón "Run workflow")

# Evita que se solapen dos ejecuciones si una tarda de más.
concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No hay dependencias que instalar (fetch nativo), así que una sola pasada:
      - name: Ejecutar screener (una pasada)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node screener.js
